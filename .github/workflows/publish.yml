name: Publish Beta

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/releases/**'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud development files
        shell: pwsh
        run: |
          $dalamudDir = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Path $dalamudDir -Force | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP 'dalamud-latest.zip'
          Invoke-WebRequest -Uri 'https://goatcorp.github.io/dalamud-distrib/latest.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $dalamudDir -Force

      - name: Run regression tests
        run: dotnet run --project tests/ClassySentinel.PositionTests/ClassySentinel.PositionTests.csproj -c Release

      - name: Verify Sentinel Core pin and UI package hash
        shell: pwsh
        run: ./.github/scripts/Verify-SentinelCore.ps1

      - name: Read version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content -LiteralPath 'ClassySentinel.csproj' -Raw
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw "Invalid version: $version" }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - run: dotnet restore ClassySentinel.csproj --locked-mode
      - run: dotnet build ClassySentinel.csproj -c Release --no-restore

      - name: Prepare release asset
        shell: pwsh
        run: Copy-Item -LiteralPath 'bin/Release/ClassySentinel/latest.zip' -Destination "$env:RUNNER_TEMP\ClassySentinel.zip" -Force

      - name: Create or replace prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $asset = "$env:RUNNER_TEMP\ClassySentinel.zip"
          gh release view $tag --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset --clobber --repo '${{ github.repository }}'
          }
          else {
            gh release create $tag $asset --repo '${{ github.repository }}' --target '${{ github.sha }}' --title "Classy Sentinel ${{ steps.version.outputs.value }} beta" --notes "Beta release built and packaged by GitHub Actions. Human in-game validation is required before wider distribution." --prerelease
          }

      - name: Update this repository's manifest
        shell: pwsh
        run: |
          $path = 'repo.json'
          $entries = @(Get-Content -LiteralPath $path -Raw | ConvertFrom-Json)
          $entry = $entries | Where-Object InternalName -eq 'ClassySentinel' | Select-Object -First 1
          if ($null -eq $entry) { throw 'ClassySentinel entry is missing.' }
          $entry.AssemblyVersion = '${{ steps.version.outputs.value }}'
          $entry.TestingAssemblyVersion = '${{ steps.version.outputs.value }}'
          $entry.LastUpdate = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          $tag = '${{ steps.version.outputs.tag }}'
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/ClassySentinel.zip"
          $entry.DownloadLinkInstall = $url
          $entry.DownloadLinkUpdate = $url
          $entry.DownloadLinkTesting = $url
          ConvertTo-Json -InputObject $entries -Depth 20 | Set-Content -LiteralPath $path -Encoding utf8

      - name: Commit updated repository manifest
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- repo.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Publish beta v${{ steps.version.outputs.value }} [skip ci]"
            git push origin HEAD:main
          }

      - name: Trigger central Sentinel catalog reconciliation
        id: catalog-notify
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.DALAMUD_CATALOG_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            Write-Warning 'DALAMUD_CATALOG_TOKEN is unavailable; skipping optional central catalog notification.'
            "status=skipped" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }

          $payload = @{
            event_type = 'plugin-released'
            client_payload = @{
              source_repository = '${{ github.repository }}'
              source_commit = '${{ github.sha }}'
              internal_name = 'ClassySentinel'
              version = '${{ steps.version.outputs.value }}'
              tag = '${{ steps.version.outputs.tag }}'
            }
          } | ConvertTo-Json -Depth 5

          $payload | gh api `
            --method POST `
            'repos/MarshalTitan/Sentinel/dispatches' `
            --input -
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to dispatch the central Sentinel catalog reconciliation.'
          }
          "status=dispatched" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Verify public central Sentinel catalog
        if: steps.catalog-notify.outputs.status == 'dispatched'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.DALAMUD_CATALOG_TOKEN }}
        run: |
          $catalogUrl = 'https://api.github.com/repos/MarshalTitan/Sentinel/contents/repo.json?ref=main'
          $expectedVersion = '${{ steps.version.outputs.value }}'
          $expectedAsset = "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/ClassySentinel.zip"
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }

          for ($attempt = 1; $attempt -le 60; $attempt++) {
            try {
              $response = Invoke-RestMethod -Uri $catalogUrl -Headers $headers
              $json = [Text.Encoding]::UTF8.GetString(
                [Convert]::FromBase64String(($response.content -replace '\s', '')))
              $catalog = @($json | ConvertFrom-Json)
              $entry = @($catalog | Where-Object InternalName -eq 'ClassySentinel')
              if ($entry.Count -eq 1 `
                  -and $entry[0].AssemblyVersion -eq $expectedVersion `
                  -and $entry[0].TestingAssemblyVersion -eq $expectedVersion `
                  -and $entry[0].DownloadLinkInstall -eq $expectedAsset `
                  -and $entry[0].DownloadLinkUpdate -eq $expectedAsset `
                  -and $entry[0].DownloadLinkTesting -eq $expectedAsset) {
                Write-Host "Verified Classy Sentinel $expectedVersion in the public central catalog."
                exit 0
              }
            }
            catch {
              Write-Host "Central catalog verification attempt $attempt failed: $($_.Exception.Message)"
            }

            Start-Sleep -Seconds 5
          }

          throw "The public central Sentinel catalog did not reach Classy Sentinel $expectedVersion within five minutes."
