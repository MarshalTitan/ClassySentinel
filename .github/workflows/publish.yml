name: Publish Beta

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/releases/**'

permissions:
  contents: write

concurrency:
  group: classy-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Resolve release source
        id: source
        shell: pwsh
        run: '"sha=$(git rev-parse HEAD)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8'

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud development files
        shell: pwsh
        run: |
          $dalamudDir = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Path $dalamudDir -Force | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP 'dalamud-latest.zip'
          Invoke-WebRequest -Uri 'https://goatcorp.github.io/dalamud-distrib/latest.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $dalamudDir -Force

      - name: Run regression tests
        run: dotnet run --project tests/ClassySentinel.PositionTests/ClassySentinel.PositionTests.csproj -c Release

      - name: Verify Sentinel Core pin and UI package hash
        shell: pwsh
        run: ./.github/scripts/Verify-SentinelCore.ps1

      - name: Read version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content -LiteralPath 'ClassySentinel.csproj' -Raw
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw "Invalid version: $version" }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - run: dotnet restore ClassySentinel.csproj --locked-mode
      - run: dotnet build ClassySentinel.csproj -c Release --no-restore

      - name: Validate installable package
        shell: pwsh
        run: ./.github/scripts/Validate-Package.ps1 -PackagePath 'bin/Release/ClassySentinel/latest.zip' -ExpectedVersion '${{ steps.version.outputs.value }}'

      - name: Prepare release asset
        shell: pwsh
        run: Copy-Item -LiteralPath 'bin/Release/ClassySentinel/latest.zip' -Destination "$env:RUNNER_TEMP\ClassySentinel.zip" -Force

      - name: Hash release asset
        id: asset
        shell: pwsh
        run: |
          $hash = (Get-FileHash -LiteralPath "$env:RUNNER_TEMP\ClassySentinel.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Release ZIP SHA-256: $hash"

      - name: Publish immutable GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $asset = "$env:RUNNER_TEMP\ClassySentinel.zip"
          $releaseJson = gh release view $tag --repo '${{ github.repository }}' --json targetCommitish,isDraft,isPrerelease,assets 2>$null
          $exists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          if ($exists) {
            $release = $releaseJson | ConvertFrom-Json
            if ($release.targetCommitish -ne '${{ github.sha }}' -or $release.isDraft -or !$release.isPrerelease) {
              throw "Release $tag belongs to another source/state. Increment the version; assets are immutable."
            }
            if (@($release.assets | Where-Object name -eq 'ClassySentinel.zip').Count -ne 1) {
              throw "Release $tag must contain exactly one ClassySentinel.zip; do not replace published assets."
            }
            Write-Host "Revalidating the existing immutable release for this exact source."
          }
          else {
            gh release create $tag $asset --repo '${{ github.repository }}' --target '${{ github.sha }}' --title "Classy Sentinel ${{ steps.version.outputs.value }}" --notes "Built and tested by GitHub Actions. See source changes and supervised acceptance evidence for gameplay status." --prerelease
            if ($LASTEXITCODE -ne 0) { throw "Failed to create $tag." }
          }

      - name: Validate public release ZIP before child promotion
        shell: pwsh
        run: |
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/ClassySentinel.zip"
          $download = Join-Path $env:RUNNER_TEMP 'public-ClassySentinel.zip'
          for ($attempt = 1; $attempt -le 12; $attempt++) {
            try {
              Invoke-WebRequest -Uri "$url`?release=${{ github.run_id }}-$attempt" -OutFile $download -TimeoutSec 60
              ./.github/scripts/Validate-Package.ps1 -PackagePath $download -ExpectedVersion '${{ steps.version.outputs.value }}'
              break
            }
            catch {
              if ($attempt -eq 12) { throw }
              Start-Sleep -Seconds 5
            }
          }

      - name: Publish authoritative child manifest and verify central catalog
        uses: MarshalTitan/Sentinel/.github/actions/distribute@4bbc5ce50837b37c8cfaee5c39a075c4f68858ed
        with:
          internal-name: ClassySentinel
          version: ${{ steps.version.outputs.value }}
          tag: ${{ steps.version.outputs.tag }}
          notification-token: ${{ secrets.DALAMUD_CATALOG_TOKEN }}
